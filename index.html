<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Classroom Reward Board</title>
  <style>
    * { box-sizing: border-box; }
    
    html {
      height: -webkit-fill-available;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0;
      padding: 15px 10px 25px 10px;
      user-select: none;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      position: relative;
    }

    /* Top Navigation / Title Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      width: 100%;
      max-width: 480px;
      margin-bottom: 10px;
      gap: 10px;
      flex-shrink: 0;
    }

    .title-section {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
    }

    h1 {
      color: #2c3e50;
      font-size: 1.2rem;
      margin: 0 0 4px 0;
      text-align: left;
    }

    /* Rules Box at Top Right */
    .rules-box {
      background: #ffffff;
      border: 1px solid #e1e8ed;
      border-left: 4px solid #2ec4b6;
      border-radius: 12px;
      padding: 8px 10px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      max-width: 210px;
      flex-shrink: 0;
    }

    .rules-title {
      font-size: 0.75rem;
      font-weight: 800;
      color: #2c3e50;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .rules-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .rules-list li {
      font-size: 0.7rem;
      color: #4a5568;
      line-height: 1.35;
      margin-bottom: 3px;
      display: flex;
      align-items: flex-start;
      gap: 4px;
    }

    .rules-list li:last-child {
      margin-bottom: 0;
    }

    .rules-badge {
      background: #e8f4fd;
      color: #2ec4b6;
      font-weight: bold;
      border-radius: 4px;
      padding: 1px 4px;
      font-size: 0.65rem;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* Vertical Board Container */
    .board-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      max-width: 480px;
      min-height: 420px;
      background: white;
      padding: 12px 10px;
      border-radius: 20px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.08);
      gap: 6px;
      margin-bottom: 12px;
      flex-shrink: 0;
    }

    .lane {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      flex: 1;
      cursor: pointer;
      padding: 6px 4px;
      border-radius: 12px;
      transition: background 0.2s;
    }

    .lane.selected {
      background-color: #e8f4fd;
      border: 2px solid #2ec4b6;
    }

    .reward-top {
      font-size: 22px;
      margin-bottom: 4px;
      flex-shrink: 0;
    }

    .steps-column {
      display: flex;
      flex-direction: column-reverse;
      justify-content: space-between;
      flex-grow: 1;
      width: 100%;
      align-items: center;
      margin: 6px 0;
      min-height: 280px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background-color: #e0e0e0;
      transition: background-color 0.2s ease;
      flex-shrink: 0;
    }

    .dot.active {
      background-color: #4caf50;
      box-shadow: 0 0 4px #4caf50;
    }

    .character-bottom {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex-shrink: 0;
    }

    .char-icon {
      font-size: 26px;
      transition: transform 0.2s;
    }

    .lane.selected .char-icon {
      transform: scale(1.2);
    }

    .student-name {
      font-size: 0.75rem;
      font-weight: bold;
      color: #333;
      margin-top: 2px;
    }

    /* Control Panel */
    .controls {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .selected-info {
      font-weight: bold;
      color: #2c3e50;
      font-size: 0.95rem;
      min-height: 22px;
    }

    .btn-group {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    button {
      flex: 1;
      font-size: 1rem;
      font-weight: bold;
      padding: 12px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: transform 0.1s;
    }

    button:active { transform: scale(0.96); }

    .btn-add { background-color: #2ec4b6; color: white; }
    .btn-sub { background-color: #ff9f1c; color: white; }
    
    .reset-bar {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 2px;
    }

    .btn-reset { 
      background-color: transparent; 
      color: #777; 
      box-shadow: none; 
      font-size: 0.75rem;
      padding: 6px;
      border: 1px solid #ddd;
    }

    /* Centered Pretty Modal Overlay */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(3px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 1000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: white;
      width: 85%;
      max-width: 320px;
      padding: 24px 20px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      text-align: center;
      transform: scale(0.8);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .modal-overlay.active .modal-card {
      transform: scale(1);
    }

    .modal-icon { font-size: 42px; margin-bottom: 8px; }
    .modal-title { font-size: 1.15rem; font-weight: bold; color: #2c3e50; margin-bottom: 8px; }
    .modal-message { font-size: 0.95rem; color: #666; margin-bottom: 20px; line-height: 1.4; }
    .modal-actions { display: flex; gap: 10px; }

    .modal-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: bold;
    }

    .modal-btn-primary { background: #2ec4b6; color: white; }
    .modal-btn-secondary { background: #e0e0e0; color: #555; }
    .modal-btn-danger { background: #e74c3c; color: white; }

    /* Landscape Adjustments */
    @media (min-aspect-ratio: 1/1) {
      .top-bar {
        max-width: 520px;
      }
      .board-container {
        max-width: 520px;
        min-height: 380px;
      }
      .steps-column {
        min-height: 240px;
      }
      .controls {
        max-width: 520px;
      }
    }
  </style>
</head>
<body>

  <!-- Top Bar with Title and Top-Right Rules Box -->
  <div class="top-bar">
    <div class="title-section">
      <h1>🏆 Class Reward Race</h1>
    </div>

    <!-- Rules / Action Box -->
    <div class="rules-box">
      <div class="rules-title">📌 Class Rules</div>
      <ul class="rules-list" id="rulesList">
        <!-- Rendered dynamically from script -->
      </ul>
    </div>
  </div>

  <!-- 5 Student Lanes -->
  <div class="board-container" id="board"></div>

  <!-- Teacher Controls -->
  <div class="controls">
    <div class="selected-info" id="selectedInfo">Tap a student to select</div>
    <div class="btn-group">
      <button class="btn-sub" onclick="moveStep(-1)">-1 Step</button>
      <button class="btn-add" onclick="moveStep(1)">+1 Step</button>
    </div>
    
    <div class="reset-bar">
      <button class="btn-reset" onclick="promptResetSelected()">Reset Selected</button>
      <button class="btn-reset" onclick="promptResetAll()">Reset All</button>
    </div>
  </div>

  <!-- Centered Modal Overlay -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <div class="modal-icon" id="modalIcon">🎉</div>
      <div class="modal-title" id="modalTitle">Title</div>
      <div class="modal-message" id="modalMessage">Message</div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <script>
    const totalSteps = 20;

    // Rules displayed in the top-right box (you can edit or add rules here)
    const classroomRules = [
      { badge: "+1 Step", text: "follow classroom rules 🤫" },
      { badge: "+2 Steps", text: "help a friend 👯" },
      { badge: "+3 Step", text: "answer the question 🙋🏻‍♀️" }
      
    ];

    const students = [
      { id: 0, name: "Student 1", icon: "🐱", reward: "🏆" },
      { id: 1, name: "Student 2", icon: "🐶", reward: "🏆" },
      { id: 2, name: "Student 3", icon: "🦊", reward: "🏆" },
      { id: 3, name: "Student 4", icon: "🐼", reward: "🏆" },
      { id: 4, name: "Student 5", icon: "🦁", reward: "🏆" }
    ];

    let selectedIndex = 0;
    let progress = JSON.parse(localStorage.getItem('studentProgress')) || [0, 0, 0, 0, 0];

    function renderRules() {
      const rulesContainer = document.getElementById('rulesList');
      rulesContainer.innerHTML = '';
      classroomRules.forEach(rule => {
        const li = document.createElement('li');
        li.innerHTML = `<span class="rules-badge">${rule.badge}</span> <span>${rule.text}</span>`;
        rulesContainer.appendChild(li);
      });
    }

    function renderBoard() {
      const boardElement = document.getElementById('board');
      boardElement.innerHTML = '';

      students.forEach((student, index) => {
        const lane = document.createElement('div');
        lane.className = `lane ${selectedIndex === index ? 'selected' : ''}`;
        lane.onclick = () => selectStudent(index);

        const rewardDiv = document.createElement('div');
        rewardDiv.className = 'reward-top';
        rewardDiv.innerText = progress[index] >= totalSteps ? '🎉' : student.reward;

        const stepsColumn = document.createElement('div');
        stepsColumn.className = 'steps-column';

        for (let i = 1; i <= totalSteps; i++) {
          const dot = document.createElement('div');
          dot.className = `dot ${i <= progress[index] ? 'active' : ''}`;
          stepsColumn.appendChild(dot);
        }

        const charBottom = document.createElement('div');
        charBottom.className = 'character-bottom';

        const charIcon = document.createElement('div');
        charIcon.className = 'char-icon';
        charIcon.innerText = student.icon;

        const nameLabel = document.createElement('div');
        nameLabel.className = 'student-name';
        nameLabel.innerText = student.name;

        charBottom.appendChild(charIcon);
        charBottom.appendChild(nameLabel);

        lane.appendChild(rewardDiv);
        lane.appendChild(stepsColumn);
        lane.appendChild(charBottom);

        boardElement.appendChild(lane);
      });

      const info = document.getElementById('selectedInfo');
      const current = students[selectedIndex];
      const steps = progress[selectedIndex];
      info.innerText = `Selected: ${current.name} (Step ${steps}/${totalSteps})`;
    }

    function selectStudent(index) {
      selectedIndex = index;
      renderBoard();
    }

    function moveStep(val) {
      let currentVal = progress[selectedIndex];
      let newVal = currentVal + val;

      if (newVal >= 0 && newVal <= totalSteps) {
        progress[selectedIndex] = newVal;
        
        if (newVal === totalSteps) {
          renderBoard();
          showModal({
            icon: "🎉",
            title: "Reward Reached!",
            message: `Congratulations! <b>${students[selectedIndex].name}</b> has completed the path!`,
            actions: [
              {
                text: "Awesome!",
                class: "modal-btn-primary",
                onClick: () => {
                  progress[selectedIndex] = 0;
                  localStorage.setItem('studentProgress', JSON.stringify(progress));
                  renderBoard();
                  closeModal();
                }
              }
            ]
          });
        } else {
          localStorage.setItem('studentProgress', JSON.stringify(progress));
          renderBoard();
        }
      }
    }

    function promptResetSelected() {
      const current = students[selectedIndex];
      showModal({
        icon: "🔄",
        title: "Reset Student?",
        message: `Reset <b>${current.name}</b> back to step 0?`,
        actions: [
          { text: "Cancel", class: "modal-btn-secondary", onClick: closeModal },
          {
            text: "Reset",
            class: "modal-btn-danger",
            onClick: () => {
              progress[selectedIndex] = 0;
              localStorage.setItem('studentProgress', JSON.stringify(progress));
              renderBoard();
              closeModal();
            }
          }
        ]
      });
    }

    function promptResetAll() {
      showModal({
        icon: "⚠️",
        title: "Reset All Progress?",
        message: "Are you sure you want to reset <b>ALL</b> students back to step 0?",
        actions: [
          { text: "Cancel", class: "modal-btn-secondary", onClick: closeModal },
          {
            text: "Reset All",
            class: "modal-btn-danger",
            onClick: () => {
              progress = [0, 0, 0, 0, 0];
              localStorage.setItem('studentProgress', JSON.stringify(progress));
              renderBoard();
              closeModal();
            }
          }
        ]
      });
    }

    function showModal({ icon, title, message, actions }) {
      document.getElementById('modalIcon').innerText = icon;
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('modalMessage').innerHTML = message;

      const actionsContainer = document.getElementById('modalActions');
      actionsContainer.innerHTML = '';

      actions.forEach(action => {
        const btn = document.createElement('button');
        btn.className = `modal-btn ${action.class}`;
        btn.innerText = action.text;
        btn.onclick = action.onClick;
        actionsContainer.appendChild(btn);
      });

      document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modalOverlay').classList.remove('active');
    }

    // Initialize Page
    renderRules();
    renderBoard();
  </script>
</body>
</html>

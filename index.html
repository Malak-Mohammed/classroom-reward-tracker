<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <title>Bunny Garden - Select Grade</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    body {
      background: url('background.jpeg') center center / cover no-repeat #8ee4af;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 16px) env(safe-area-inset-left, 16px);
    }

    /* Card Container */
    .landing-card {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 28px;
      padding: clamp(24px, 5vh, 40px) clamp(24px, 5vw, 48px);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      max-width: 420px;
      width: 90%;
    }

    /* Buttons Container */
    .grade-buttons {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
    }

    /* Grade Action Buttons */
    .btn-grade {
      width: 100%;
      padding: clamp(14px, 2.5vh, 20px) 24px;
      font-size: clamp(1.1rem, 2.2vw, 1.35rem);
      font-weight: 900;
      color: white;
      border: none;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.15);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
    }

    .btn-grade-one {
      background: linear-gradient(135deg, #ff9f1c, #ffbf69);
    }

    .btn-grade-two {
      background: linear-gradient(135deg, #2ec4b6, #209388);
    }

    .btn-grade:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.22);
    }

    .btn-grade:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
    }

    /* Responsive adjustments for landscape mobile */
    @media (max-height: 500px) {
      .landing-card {
        padding: 18px 28px;
      }
      .grade-buttons {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

  <div class="landing-card">
    <div class="grade-buttons">
      <!-- Grade One Button -->
      <a href="GradeOne.html" class="btn-grade btn-grade-one">
        Grade One
      </a>

      <!-- Grade Two Button -->
      <a href="GradeTwo.html" class="btn-grade btn-grade-two">
        Grade Two
      </a>
    </div>
  </div>

</body>
</html>
